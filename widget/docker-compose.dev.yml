services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    command: node server.js
    environment:
      - NODE_ENV=development
      - PORT=4000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}

  chat-widget:
    build:
      context: ./chat-widget
      dockerfile: Dockerfile.dev
    ports:
      - "${WIDGET_PORT:-5173}:5173"
    volumes:
      - ./chat-widget:/app
      - /app/node_modules
    working_dir: /app
    command: yarn dev --host
    environment:
      - NODE_ENV=development
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:4000}

  test-env:
    image: nginx:alpine
    volumes:
      - ./test-env:/usr/share/nginx/html:ro
    ports:
      - "${TEST_ENV_PORT:-8080}:80"
