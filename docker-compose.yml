  # users_api:
  users_api:
    build: voicely/voicely/app/services/users_service
    container_name: users_service
    ports:
      - "3000:3000"
    volumes:
      - ./voicely/voicely/app/services/users_service:/usr/src/app
    command: ./scripts/db_startup.sh db -- yarn run dev
    depends_on:
      - db
    environment:
      DB_HOST: db
    networks:
      - app_network

  # organisations_api:
  organisations_api:
    build: voicely/voicely/app/services/organisations_service
    container_name: organisations_service
    ports:
      - "3001:3001"
    volumes:
      - ./voicely/voicely/app/services/organisations_service:/usr/src/app
    command: ./scripts/db_startup.sh db -- yarn run dev
    depends_on:
      - db
    environment:
      DB_HOST: db
    networks:
      - app_network

  # surveys_api:
  surveys_api:
    build: voicely/voicely/app/services/surveys_service
    container_name: surveys_service
    ports:
      - "3002:3002"
    volumes:
      - ./voicely/voicely/app/services/surveys_service:/usr/src/app
    command: ./scripts/db_startup.sh db -- yarn run dev
    depends_on:
      - db
    environment:
      DB_HOST: db
    networks:
      - app_network

  # questions_api:
  questions_api:
    build: voicely/voicely/app/services/questions_service
    container_name: questions_service
    ports:
      - "3003:3003"
    volumes:
      - ./voicely/voicely/app/services/questions_service:/usr/src/app
    command: ./scripts/db_startup.sh db -- yarn run dev
    depends_on:
      - db
    environment:
      DB_HOST: db
    networks:
      - app_network

  # resposnses_api:
  responses_api:
    build: voicely/voicely/app/services/responses_service
    container_name: responses_service
    ports:
      - "3004:3004"
    volumes:
      - ./voicely/voicely/app/services/responses_service:/usr/src/app
    command: ./scripts/db_startup.sh db -- yarn run dev
    depends_on:
      - db
    environment:
      DB_HOST: db
    networks:
      - app_network

  # db:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: public
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - ./voicely/voicely/app/db/__schema/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./voicely/voicely/app/db/__test_data/data.sql:/docker-entrypoint-initdb.d/2-data.sql
      - ./voicely/voicely/app/db/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
