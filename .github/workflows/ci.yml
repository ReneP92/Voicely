name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Fresh checkout setup
        run: bun run setup
      - name: Quality, database and built-process checks
        run: bun run verify
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Database logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color
      - name: Stop services
        if: always()
        run: docker compose -f compose.yaml down
